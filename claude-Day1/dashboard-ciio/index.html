<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sales Analytics Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#orders">Skip to orders table</a>

  <header class="page-header">
    <h1>Sales analytics</h1>
    <p class="subtle" id="data-summary">Loading sales data…</p>
  </header>

  <main>
    <section class="filters" aria-label="Filters">
      <div class="field">
        <label for="region-filter">Region</label>
        <select id="region-filter" disabled>
          <option value="">All regions</option>
        </select>
      </div>
      <div class="field">
        <label for="category-filter">Category</label>
        <select id="category-filter" disabled>
          <option value="">All categories</option>
        </select>
      </div>
      <button type="button" class="btn" id="reset-filters" disabled>Reset filters</button>
      <p class="filter-status" id="filter-status" role="status" aria-live="polite"></p>
    </section>

    <div class="notice" id="notice" role="alert" hidden></div>

    <section class="kpis" aria-label="Key metrics">
      <article class="kpi kpi-hero">
        <h2>Total revenue</h2>
        <p class="kpi-value" id="kpi-revenue">—</p>
      </article>
      <article class="kpi">
        <h2>Total orders</h2>
        <p class="kpi-value" id="kpi-orders">—</p>
      </article>
      <article class="kpi">
        <h2>Average order value</h2>
        <p class="kpi-value" id="kpi-aov">—</p>
      </article>
      <article class="kpi kpi-wide">
        <h2>Top category</h2>
        <p class="kpi-value" id="kpi-top">—</p>
        <p class="kpi-sub subtle" id="kpi-top-sub"></p>
      </article>
    </section>

    <section class="charts" aria-label="Charts">
      <article class="card card-trend">
        <header class="card-head">
          <h2>Monthly revenue</h2>
          <p class="subtle" id="trend-sub"></p>
        </header>
        <div class="chart-wrap">
          <div class="chart" id="trend-chart"></div>
        </div>
      </article>

      <article class="card card-category">
        <header class="card-head">
          <h2>Revenue by category</h2>
          <p class="subtle" id="category-sub"></p>
        </header>
        <div class="chart-wrap">
          <div class="chart" id="category-chart"></div>
        </div>
      </article>
    </section>

    <section class="card" id="orders" aria-labelledby="orders-title">
      <header class="card-head">
        <h2 id="orders-title">Orders</h2>
        <p class="subtle" id="orders-sub"></p>
      </header>
      <div class="table-scroll" tabindex="0" role="region" aria-labelledby="orders-title">
        <table class="orders-table" id="orders-table">
          <thead>
            <tr>
              <th scope="col" data-key="id" aria-sort="none"><button type="button">Order ID</button></th>
              <th scope="col" data-key="date" aria-sort="descending"><button type="button">Date</button></th>
              <th scope="col" data-key="category" aria-sort="none"><button type="button">Category</button></th>
              <th scope="col" data-key="region" aria-sort="none"><button type="button">Region</button></th>
              <th scope="col" data-key="revenue" aria-sort="none" class="num"><button type="button">Revenue</button></th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
          <tfoot id="orders-foot"></tfoot>
        </table>
      </div>
      <div class="empty" id="orders-empty" hidden>
        <p class="empty-title">No orders match these filters</p>
        <p class="subtle">Try a different region or category, or clear the filters.</p>
        <button type="button" class="btn" id="empty-reset">Reset filters</button>
      </div>
      <div class="more" id="orders-more" hidden>
        <button type="button" class="btn" id="show-more">Show more orders</button>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
